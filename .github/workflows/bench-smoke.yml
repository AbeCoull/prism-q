name: Bench fixtures smoke

# Every bench row once in Criterion's test mode. About half an hour, so it runs
# nightly and on pull requests that change code the fixtures execute.
on:
  schedule:
    - cron: '0 3 * * *'
  pull_request:
    paths:
      - 'src/**'
      - 'benches/**'
      - 'scripts/bench_smoke.sh'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench-smoke:
    name: Bench fixtures smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: bench-smoke
      - name: Run every bench row once
        run: bash scripts/bench_smoke.sh
