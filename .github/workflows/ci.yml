name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Features exercised on runners without CUDA. The `gpu` feature links against CUDA via
  # cudarc's dynamic-linking mode and can't build on hosts that don't have the NVIDIA
  # toolkit installed, so CI enumerates features instead of using --all-features.
  CI_FEATURES: parallel
  # Separate from CI_FEATURES so the default published feature set stays tested alone.
  CI_DIST_FEATURES: parallel distributed
  # Mirrors `rust-version` in Cargo.toml and `msrv` in clippy.toml. Update all three together.
  CI_MSRV: 1.87.0
  # Doc surface. rustdoc compiles but never links, and cudarc's build script with the
  # pinned cuda-12040 feature does not probe for a toolkit, so the gpu and distributed
  # docs build on a bare runner. distributed-mpi stays out: mpi-sys fails in its build
  # script when no MPI library is installed.
  CI_DOC_FEATURES: parallel,gpu,distributed
  CI_BENCH_FEATURES: parallel,bench-fast
  REGRESSION_THRESHOLD: ${{ vars.REGRESSION_THRESHOLD || '5.0' }}

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: taiki-e/install-action@cargo-nextest

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --features "$CI_FEATURES" -- -D warnings -D clippy::undocumented_unsafe_blocks

      # The bindings are not a default workspace member, so the line above stops
      # at the root crate. This is the configuration every wheel ships.
      - name: Clippy Python bindings
        run: cargo clippy -p prism-q-py --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks

      # The tile budget is pinned to the development host's so the fused circuits
      # under test match a local run; the macOS and Windows jobs leave it detected.
      - name: Tests
        run: cargo nextest run --features "$CI_FEATURES"
        env:
          PRISM_TILE_KB: "256"

      - name: Doc tests
        run: cargo test --doc --features "$CI_FEATURES"

      - name: Doc build
        run: cargo doc --no-deps --features "$CI_DOC_FEATURES"
        env:
          RUSTDOCFLAGS: -D warnings

  check-release-profile:
    name: Test (release profile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          key: ci-release
      - uses: taiki-e/install-action@cargo-nextest

      # `[profile.test]` keeps debug assertions on, so a wrong answer that only a
      # `debug_assert!` notices never reaches a test. This lane runs the unit
      # tests and the conformance and golden binaries with assertions off.
      - name: Tests with debug assertions off
        run: >-
          cargo nextest run --cargo-profile ci-release --features "$CI_FEATURES"
          --lib
          --test conformance_matrix --test backend_matrix --test measurement_matrix
          --test golden_small_circuits --test openqasm_goldens
          --test density_matrix_correctness --test backend_equivalence

  check-no-default-features:
    name: Lint & Test (no default features)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: taiki-e/install-action@cargo-nextest

      - name: Clippy
        run: cargo clippy --all-targets --no-default-features -- -D warnings -D clippy::undocumented_unsafe_blocks

      - name: Tests
        run: cargo nextest run --no-default-features

      - name: Doc tests
        run: cargo test --doc --no-default-features

  # `distributed = []` pulls in nothing; every mpi:: reference sits behind
  # `distributed-mpi`, and the tests drive ranks over threads, so no MPI runtime is
  # needed. nextest is required: one test sets a process-wide environment variable.
  check-distributed:
    name: Lint & Test (distributed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: taiki-e/install-action@cargo-nextest

      - name: Clippy
        run: cargo clippy --all-targets --features "$CI_DIST_FEATURES" -- -D warnings -D clippy::undocumented_unsafe_blocks

      - name: Tests
        run: cargo nextest run --features "$CI_DIST_FEATURES"

  # The MPI transport against Open MPI, under a real launcher. The loopback suite
  # above never links MPI, and a Windows MS-MPI run speaks for neither Open MPI's
  # handle types (`MPI_Comm` is a pointer there, an int in MS-MPI) nor its launcher.
  # `--require` turns every skip in the script and in test_distributed.py into a
  # failure, and each launch asserts the world size it asked for.
  mpi-linux:
    name: MPI acceptance (Linux, Open MPI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Single-copy shared memory reads peer ranks through process_vm_readv, which
      # a ptrace-restricted host refuses mid-transfer. Copy-in/copy-out keeps the
      # run independent of that host setting.
      OMPI_MCA_btl_vader_single_copy_mechanism: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      # mpi-sys runs bindgen over mpi.h, so it needs libclang beside the MPI headers.
      - name: Install Open MPI and libclang
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin libclang-dev

      # maturin develop installs only into a virtualenv. mpi4py builds from source
      # so it compiles against the same Open MPI as the extension and the launcher.
      - name: Python environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/pip" install maturin numpy pytest
          "$RUNNER_TEMP/venv/bin/pip" install --no-binary mpi4py mpi4py

      - name: Compile and lint against Open MPI
        run: cargo clippy --all-targets --features "parallel distributed-mpi" -- -D warnings -D clippy::undocumented_unsafe_blocks

      - name: Compile and lint the Python bindings against Open MPI
        run: cargo clippy -p prism-q-py --all-targets --features distributed-mpi -- -D warnings -D clippy::undocumented_unsafe_blocks

      - name: Rank check and Python distributed tests at 1, 2, and 4 ranks
        run: bash scripts/test-mpi.sh --require

  # Miri interprets the determinism target, which drives every parallel kernel family
  # at cfg(miri)-reduced sizes, and rejects undefined behavior in the SendPtr
  # partitioning paths (aliasing, provenance, data races) that no native test can see.
  # SIMD dispatch resolves to the scalar fallbacks under the interpreter, so the vector
  # intrinsics stay out of reach; the sanitizer job below covers native execution.
  # Interpreting the full suite is not viable, hence the single-target scope.
  miri:
    name: Miri
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Tree Borrows instead of Stacked Borrows: crossbeam-epoch's intrusive list
      # (rayon's deque) casts an interior Entry pointer back to its container, which
      # Stacked Borrows rejects inside the dependency before any project code runs.
      # Leak checking is off because the global Rayon pool never joins its workers,
      # so threads alive at process exit would fail every run. Isolation is off so
      # the thread cap below reaches the interpreted program. The memory caps are
      # pinned because the interpreter cannot execute the host memory probe behind
      # them (a foreign function on every OS). Deterministic floats: miri otherwise
      # perturbs math-function results per call to model their unspecified
      # precision, which fails the bitwise thread-count comparison through the
      # sin/cos in gate-matrix preparation.
      MIRIFLAGS: >-
        -Zmiri-tree-borrows -Zmiri-ignore-leaks -Zmiri-disable-isolation
        -Zmiri-deterministic-floats
      RAYON_NUM_THREADS: "2"
      PRISM_MAX_SV_QUBITS: "26"
      PRISM_MAX_DM_QUBITS: "13"
      PRISM_MAX_PROB_QUBITS: "26"
      PRISM_MAX_EXPORT_QUBITS: "26"
      PRISM_MAX_DENSE_OUTCOME_BITS: "26"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      # The runner's default toolchain stays stable; the explicit +nightly is what
      # routes cargo at the toolchain the action installed.
      - name: Miri over the partitioning kernels
        run: cargo +nightly miri test --features parallel --test determinism

  # ThreadSanitizer runs the parallel kernels on real threads and reports data races
  # the SAFETY comments only argue away. -Zbuild-std instruments std so its
  # synchronization is visible to the tool; the explicit --target keeps RUSTFLAGS away
  # from build scripts. backend_equivalence adds the parallel crossover circuits at
  # 16q/20q on top of the determinism target's kernel sweep.
  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RUSTFLAGS: -Zsanitizer=thread
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/tsan-suppressions.txt
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      # Runner kernels hand out 32 bits of mmap randomness, outside the range the
      # TSan shadow mapping tolerates.
      - name: Lower ASLR entropy for TSan
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      # The runner's default toolchain stays stable; the explicit +nightly is what
      # routes cargo at the toolchain the action installed.
      - name: ThreadSanitizer over the parallel kernels
        run: >-
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu
          --features parallel --test determinism --test backend_equivalence

  # `rust-version` is published to crates.io, and every other job runs on stable, far
  # ahead of the floor. 1.87 rather than the edition-2024 floor of 1.85: the SIMD kernels
  # call `std::arch` intrinsics from `#[target_feature]` functions without an inner unsafe
  # block, which 1.87 is the first release to accept without warning. Library targets
  # only, since dev-dependencies do not constrain a consumer.
  msrv:
    name: MSRV floor
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.CI_MSRV }}
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      # `rust-toolchain.toml` pins stable and would override the installed floor.
      - name: Check (default features)
        run: cargo +"$CI_MSRV" check --features "$CI_FEATURES"

      - name: Check (no default features)
        run: cargo +"$CI_MSRV" check --no-default-features

  # The release workflow publishes to crates.io with --no-confirm --execute and no
  # manual gate, so the version arithmetic in front of it is verified here rather
  # than at dispatch time. Seconds of runtime against a version number that can
  # be yanked but never unpublished.
  release-bump-level:
    name: Release bump level
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify the conventional-commit mapping and the pre-1.0 clamp
        run: bash scripts/release_bump_level_test.sh

  bench-gate-confirmation:
    name: Bench gate confirmation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify that only a valid second run clears a FAIL
        run: bash scripts/bench_ci_test.sh

  # Compares the public API against the last release, at the release type the
  # conventional commits since it imply before the pre-1.0 clamp, with the PR
  # title standing in for the squash subject it becomes. A break therefore passes
  # only when a commit declares it with `!` or `BREAKING CHANGE:`, so the bump
  # and the changelog cannot miss one, and a `feat` is held to additions. The
  # release type is passed explicitly because cargo-semver-checks reads a manifest
  # version equal to the baseline as a patch release, which would fail every
  # declared break below 1.0. From 1.0 the same mapping is the stability guard,
  # with nothing here to change. The feature set is the documented surface.
  semver:
    name: Semver checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Resolve the baseline and release type
        id: release
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          source scripts/release_bump_level.sh
          tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*')"
          subjects="$(git log --format=%s "$tag..HEAD")"$'\n'"$PR_TITLE"
          bodies="$(git log --format=%b "$tag..HEAD")"
          level="$(conventional_bump_level "$subjects" "$bodies")"
          type="${level/none/patch}"
          echo "baseline=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "type=$type" >> "$GITHUB_OUTPUT"
          echo "### Semver: against \`$tag\` as a \`$type\` release" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the public API
        run: >-
          cargo semver-checks --package prism-q
          --baseline-version "${{ steps.release.outputs.baseline }}"
          --release-type "${{ steps.release.outputs.type }}"
          --only-explicit-features --features "$CI_DOC_FEATURES"

  # Builds the bench binary for each commit that lands on main and caches it, so
  # the gate below can measure against a reference it did not have to compile.
  # That is the whole benefit: one build instead of two. The checkout path also
  # matches the gate's `head`, which costs nothing and keeps the two builds
  # differing only in code. It is not claimed to fix anything: on this project's
  # Windows host the build directory was measured not to change `.text` at all,
  # and the ELF case that could differ is untested.
  benchmark-reference:
    name: Benchmark Reference Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout at the path the gate uses
        uses: actions/checkout@v7
        with:
          path: head
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
      # `actions/cache` rejects a comma in a key, and the feature list carries
      # one, so the key takes a slug of it rather than the list itself.
      - id: toolchain
        run: |
          echo "version=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          echo "features=${CI_BENCH_FEATURES//,/-}" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          workspaces: head -> target

      - name: Build the reference bench binary
        working-directory: head
        run: |
          bash scripts/bench_ab.sh \
            --bench circuits \
            --features "$CI_BENCH_FEATURES" \
            --build-only "$GITHUB_WORKSPACE/bench-ref-exe/circuits"

      # Keyed on the commit, which already pins the lockfile it was built from,
      # so hashing the lockfile as well would only miss on PRs that touch it. No
      # restore-keys: a near-miss would silently measure against a commit the PR
      # was not based on, which is worse than paying for the build.
      - name: Cache it for the gate
        uses: actions/cache/save@v4
        with:
          path: bench-ref-exe/circuits
          key: bench-ref-exe-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ steps.toolchain.outputs.features }}-${{ github.sha }}

  # Adjacent-binary A/B against the PR base; see scripts/bench_ci.sh. The
  # reference worktree sits beside the checkout, not inside it: `/target/` in
  # .gitignore is anchored to the repository root, so a nested worktree's build
  # output would read as an untracked change and abort the A/B. The worktree is
  # the fallback path now: on a cache hit from the job above there is no
  # reference build at all.
  benchmark-regression:
    name: Benchmark Regression
    runs-on: ubuntu-latest
    needs: check
    if: >-
      github.event_name == 'pull_request' &&
      !contains(github.event.pull_request.labels.*.name, 'skip-bench')
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PRISM_BENCH_REF: ${{ github.event.pull_request.base.sha }}
      PRISM_BENCH_REF_DIR: ${{ github.workspace }}/bench-ref
      PRISM_BENCH_REF_EXE: ${{ github.workspace }}/bench-ref-exe/circuits
    steps:
      - name: Checkout head
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 1

      # A fork's origin does not carry the base commit.
      - name: Fetch the base commit
        working-directory: head
        run: |
          git remote add upstream "https://github.com/${{ github.repository }}"
          git fetch --no-tags --depth=1 upstream "$PRISM_BENCH_REF"

      # In-job rather than a paths filter, so a skip still reports a result and
      # the job stays safe to promote to a required check.
      - name: Decide whether anything benchmarked changed
        id: scope
        working-directory: head
        run: |
          changed="$(git diff --name-only "$PRISM_BENCH_REF" HEAD)"
          if grep -Eq '^(src/.*\.rs$|benches/.*\.rs$|Cargo\.(toml|lock)$)' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No Rust source or manifest change. Nothing to measure." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.scope.outputs.run == 'true'

      - id: toolchain
        if: steps.scope.outputs.run == 'true'
        run: |
          echo "version=$(rustc -V | tr ' ' '-')" >> "$GITHUB_OUTPUT"
          echo "features=${CI_BENCH_FEATURES//,/-}" >> "$GITHUB_OUTPUT"

      # A hit means the base commit went through Benchmark Reference Build, so
      # its binary was compiled at this same path and the reference build below
      # is skipped entirely. A miss falls back to the worktree, which still
      # gates correctly, just slower and carrying the package-path term.
      - name: Restore the reference bench binary
        id: refexe
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache/restore@v4
        with:
          path: bench-ref-exe/circuits
          key: bench-ref-exe-${{ runner.os }}-${{ steps.toolchain.outputs.version }}-${{ steps.toolchain.outputs.features }}-${{ env.PRISM_BENCH_REF }}

      - name: Prepare the reference worktree
        if: steps.scope.outputs.run == 'true' && steps.refexe.outputs.cache-hit != 'true'
        working-directory: head
        run: git worktree add --detach "$PRISM_BENCH_REF_DIR" "$PRISM_BENCH_REF"

      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true'
        with:
          cache-bin: false
          key: head
          workspaces: head -> target

      # Only when the reference has to be compiled. Restoring this workspace on
      # a cache hit would also re-save it empty at job end, making the next miss
      # more expensive than it needs to be.
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.run == 'true' && steps.refexe.outputs.cache-hit != 'true'
        with:
          cache-bin: false
          key: ref
          workspaces: bench-ref -> target

      - name: Benchmark regression gate
        if: steps.scope.outputs.run == 'true'
        working-directory: head
        run: |
          set +e
          bash scripts/bench_ci.sh
          status=$?
          {
            echo "## Benchmark Regression Gate"
            echo ""
            cat bench_results/ci-ab.md
            if [[ -f bench_results/ci-ab-confirm.md ]]; then
              echo ""
              echo "### Confirmation run"
              echo ""
              echo "The first run reported a regression, so the set ran again. Only a row"
              echo "that regressed in both blocks the merge."
              echo ""
              cat bench_results/ci-ab-confirm.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload benchmark artifacts
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-regression
          if-no-files-found: ignore
          path: |
            head/bench_results/ci-ab.md
            head/bench_results/ci-ab-confirm.md

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage
        run: cargo llvm-cov --features "$CI_FEATURES" --lcov --output-path lcov.info
      - name: Extract coverage percentage
        id: cov
        run: |
          LF=$(grep '^LF:' lcov.info | awk -F: '{s+=$2} END {print s+0}')
          LH=$(grep '^LH:' lcov.info | awk -F: '{s+=$2} END {print s+0}')
          COVERAGE=$(awk "BEGIN {if ($LF>0) printf \"%.1f\", ($LH/$LF)*100; else print \"0\"}")
          echo "percentage=$COVERAGE" >> "$GITHUB_OUTPUT"
          echo "### Coverage: ${COVERAGE}%" >> "$GITHUB_STEP_SUMMARY"
      - name: Update coverage badge
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: coverage.json
          label: coverage
          message: ${{ steps.cov.outputs.percentage }}%
          valColorRange: ${{ steps.cov.outputs.percentage }}
          minColorRange: 50
          maxColorRange: 90

  check-aarch64:
    name: Cross-compile aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Install cross-compilation toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Check (no default features)
        run: cargo check --target aarch64-unknown-linux-gnu --no-default-features
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Check (CI features)
        run: cargo check --target aarch64-unknown-linux-gnu --features "$CI_FEATURES"
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

  # Execute the NEON fallbacks under emulation. check-aarch64 above only compiles,
  # so without this the NEON kernels are never run against their scalar reference on
  # Linux. Scoped to the SIMD-relevant tests to bound QEMU wall-clock.
  test-aarch64-qemu:
    name: Test aarch64 (QEMU)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - name: SIMD kernel unit tests (NEON vs scalar)
        run: cross test --target aarch64-unknown-linux-gnu --features "$CI_FEATURES" --lib backend::simd::tests
      - name: word_ops unit tests (NEON vs scalar)
        run: cross test --target aarch64-unknown-linux-gnu --features "$CI_FEATURES" --lib backend::word_ops::tests
      - name: Batched diagonal phase reference (NEON path)
        run: cross test --target aarch64-unknown-linux-gnu --features "$CI_FEATURES" --lib backend::statevector::tests::batch_phase_matches_independent_reference
      - name: Cross-backend correctness matrix
        run: cross test --target aarch64-unknown-linux-gnu --features "$CI_FEATURES" --test backend_matrix

  # Compile-check the GPU paths with the CUDA toolkit but no device. The job only
  # compiles and runs the device-free KERNEL_NAMES test (nothing opens a device),
  # enforcing the exhaustive GPU dispatch matches and the golden_gpu registry at
  # compile time. Pinned to ubuntu-22.04: CUDA 12.4 (matching cudarc's cuda-12040
  # bindings) has no package for the ubuntu2404 repo on ubuntu-latest. The device
  # suites (tests/golden_gpu.rs, tests/golden_gpu_density_matrix.rs) skip without a
  # card and are not run anywhere in CI; scripts/test-gpu.ps1 runs them on a host
  # with a device under PRISM_REQUIRE_GPU=1.
  gpu-check:
    name: GPU compile-check (no device)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: '12.4.0'
          method: network
      # cudarc links the driver rather than loading it on demand, so a test binary
      # that reaches a driver symbol needs libcuda.so.1 present just to start, and
      # nextest starts every binary to enumerate its tests. Whether the toolkit
      # install drags a real driver in has changed upstream, so rely on the stub
      # it ships instead: it satisfies the loader, and nothing here calls into it.
      - name: Point the loader at the driver stub
        run: |
          stub=$(find "$CUDA_PATH" -path '*stubs*' -name libcuda.so | head -1)
          test -n "$stub"
          mkdir -p "$RUNNER_TEMP/cuda-stub"
          ln -sf "$stub" "$RUNNER_TEMP/cuda-stub/libcuda.so.1"
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/cuda-stub${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: taiki-e/install-action@cargo-nextest
      - name: Compile-check GPU dispatch + golden_gpu coverage
        run: cargo check --all-targets --features "parallel gpu"
      # The only build where all three feature-gated dispatch arms compile together.
      - name: Compile-check the combined feature matrix
        run: cargo check --all-targets --features "parallel gpu distributed"
      - name: Clippy GPU paths
        run: cargo clippy --all-targets --features "parallel gpu" -- -D warnings -D clippy::undocumented_unsafe_blocks
      # The bindings are not a default workspace member, so the root checks above
      # never reach their GPU arms.
      - name: Clippy Python bindings GPU paths
        run: cargo clippy -p prism-q-py --all-targets --features gpu -- -D warnings -D clippy::undocumented_unsafe_blocks
      - name: KERNEL_NAMES consistency (device-free)
        run: cargo nextest run --features "parallel gpu" -E 'test(kernel_names_match_source_entry_points)'

  test-macos-arm:
    name: Test macOS ARM64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: taiki-e/install-action@cargo-nextest
      - name: Clippy
        run: cargo clippy --all-targets --features "$CI_FEATURES" -- -D warnings -D clippy::undocumented_unsafe_blocks
      - name: Tests
        run: cargo nextest run --features "$CI_FEATURES"
      - name: Doc tests
        run: cargo test --doc --features "$CI_FEATURES"

  # The MSVC target, where the memory probe behind the qubit caps calls kernel32.
  # Bash so the commands match the other jobs: the runner default is PowerShell,
  # which does not expand `$CI_FEATURES`. The Windows main thread has 1 MiB of
  # stack, and a debug statevector run can need up to 2 MiB. libtest runs each
  # test on its own 2 MiB thread, so the suite passes; a debug example binary,
  # which runs on the main thread, can overflow, so examples stay unrun here.
  test-windows:
    name: Test Windows x64
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - uses: taiki-e/install-action@cargo-nextest
      - name: Clippy
        run: cargo clippy --all-targets --features "$CI_FEATURES" -- -D warnings -D clippy::undocumented_unsafe_blocks
      - name: Tests
        run: cargo nextest run --features "$CI_FEATURES"
      - name: Doc tests
        run: cargo test --doc --features "$CI_FEATURES"

  security:
    name: Security & Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
