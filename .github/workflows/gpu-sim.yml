name: GPU tests (simulated H100)

# Optional, non-required check. The hosted runners have no GPU, so this runs the GPU
# device suites that skip everywhere else in CI on a simulated NVIDIA H100
# (https://github.com/pantheongpu/pantheonsim). A simulator cannot reproduce
# hardware-specific behavior or timing, so it complements scripts/test-gpu.ps1 on a
# real card and does not replace it.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Everything the gpu feature builds from: cudarc and the feature list (Cargo files), the
    # toolchain, src/ (src/gpu plus the feature-gated code in the backends, sim, gates and
    # lib, including the gpu_scaffold lib tests), the device suites and their shared helpers
    # in tests/common, the setup-rust action, and this workflow. There is no build.rs.
    paths:
      - 'src/**'
      - 'tests/golden_gpu.rs'
      - 'tests/golden_gpu_density_matrix.rs'
      - 'tests/gpu_pass_census.rs'
      - 'tests/common/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/actions/setup-rust/**'
      - '.github/workflows/gpu-sim.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Same feature set as scripts/test-gpu.ps1.
  GPU_FEATURES: parallel gpu bench-internal

jobs:
  gpu-sim:
    name: GPU suites on a simulated H100 (CUDA ${{ matrix.cuda }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cuda: ['12.6', '13.0']
    env:
      # Where the action installs the toolkit selected by the matrix entry.
      CUDA_HOME: /usr/local/cuda-${{ matrix.cuda }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          cache: 'false'

      # The toolkit supplies NVRTC, which compiles the kernels at run time.
      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: nvidia/h100
          cuda-toolkit: ${{ matrix.cuda }}

      - name: Build the test binaries
        run: >
          cargo test --release --features "$GPU_FEATURES" --no-run
          --lib --test golden_gpu --test golden_gpu_density_matrix --test gpu_pass_census

      # PRISM_REQUIRE_GPU makes a missing device fail instead of skip. libnvrtc is put
      # on the loader path by hand, and nvcc must be on PATH for the simulator's NVRTC.
      - name: Run the GPU suites
        env:
          PRISM_REQUIRE_GPU: '1'
        run: |
          export LD_LIBRARY_PATH="$CUDA_HOME/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export PATH="$CUDA_HOME/bin:$PATH"
          vgpu run cargo test --release --features "$GPU_FEATURES" --lib -- gpu:: gpu_scaffold::
          vgpu run cargo test --release --features "$GPU_FEATURES" \
            --test golden_gpu --test golden_gpu_density_matrix --test gpu_pass_census
