name: Mutation checks

on:
  schedule:
    - cron: '30 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seeded-faults:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: mutation-checks
          nextest: true
      - name: Correctness tooling tests
        run: python -m unittest discover -s scripts -p 'test_correctness_tools.py'
      - name: Check phase signs, target order, and parameter replay
        run: python scripts/check_mutations.py
      - name: Upload mutation results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-results
          path: |
            target/mutation-check/report.json
            target/mutation-check/*.log
          if-no-files-found: error
