name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

# Serialize releases without cancelling one: publishing and tagging are not safe
# to interrupt partway.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Determine & Publish Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Install tools
        run: cargo install git-cliff cargo-release

      - name: Verify the bump level mapping
        run: bash scripts/release_bump_level_test.sh

      - name: Determine bump level from conventional commits
        id: bump
        run: |
          # Outside the worktree: cargo-release refuses to run on a dirty tree.
          bash scripts/release_bump_level.sh > "$RUNNER_TEMP/bump.env"
          cat "$RUNNER_TEMP/bump.env"
          cat "$RUNNER_TEMP/bump.env" >> "$GITHUB_OUTPUT"

      - name: Report bump level
        env:
          LEVEL: ${{ steps.bump.outputs.level }}
          RAW_LEVEL: ${{ steps.bump.outputs.raw_level }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          echo "### Bump level: \`$LEVEL\` (from \`$VERSION\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$LEVEL" != "$RAW_LEVEL" ]; then
            {
              echo ""
              echo "Conventional commits asked for \`$RAW_LEVEL\`, clamped to \`$LEVEL\`:"
              echo "the crate is pre-1.0, where the minor is the compatibility boundary."
              echo "Cut 1.0.0 deliberately rather than letting a breaking commit spend it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Skip if no release needed
        if: steps.bump.outputs.level == 'none'
        run: echo "No release-worthy commits. Skipping."

      - name: Configure git
        if: steps.bump.outputs.level != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run cargo release
        if: steps.bump.outputs.level != 'none'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          cargo release ${{ steps.bump.outputs.level }} \
            --no-confirm \
            --execute

      - name: Get new version tag
        if: steps.bump.outputs.level != 'none'
        id: tag
        run: |
          TAG=$(git describe --tags --abbrev=0)
          VERSION=$(printf '%s' "$TAG" | sed -E 's/^v+//')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog for this version
        if: steps.bump.outputs.level != 'none'
        id: changelog
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          # Extract the section for this version from CHANGELOG.md
          awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found" CHANGELOG.md > /tmp/release_notes.md
          echo "body_path=/tmp/release_notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.bump.outputs.level != 'none'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          body_path: ${{ steps.changelog.outputs.body_path }}
          generate_release_notes: false

      - name: Publish Python bindings in lockstep
        if: steps.bump.outputs.level != 'none'
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          sed -i -E "s/^version = \"[^\"]*\"/version = \"$VERSION\"/" bindings/python/Cargo.toml
          cargo update -p prism-q-py 2>/dev/null || true
          git add bindings/python/Cargo.toml Cargo.lock
          git commit -m "chore(python): release $VERSION"
          git tag "py-v$VERSION"
          git push origin HEAD:main
          git push origin "py-v$VERSION"
