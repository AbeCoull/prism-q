name: Tile sweep

# A manual sweep of the cache-resident tile budget on the hosted runners: one Arm
# Mac, one x86 Linux VM and one x86 Windows VM, none of which share the cache
# geometry of the host the kernels were tuned on. Shared runners resolve a 2x cliff,
# not a 5% move, so the report is triage: it says which budgets are safe on a
# geometry, and a default changes only after a full-tier A/B on real hardware.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: Criterion filter regex
        default: '^statevector/(qv|qft_textbook|random_d10)/2[02]$|^statevector/qaoa_l3/20$'
      var:
        description: Environment knob to sweep
        default: PRISM_TILE_KB
      values:
        description: Values, baseline first
        default: '256 128 512 1024 2048'
      runs:
        description: Passes over the values, alternating direction
        default: '3'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  sweep:
    name: Sweep ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
      - name: Sweep
        run: |
          bash scripts/tile_sweep.sh \
            --filter '${{ inputs.filter }}' \
            --var '${{ inputs.var }}' \
            --values '${{ inputs.values }}' \
            --runs '${{ inputs.runs }}' \
            --out bench_results/tile-sweep.md
          cat bench_results/tile-sweep.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tile-sweep-${{ matrix.os }}
          if-no-files-found: ignore
          path: bench_results/tile-sweep.md
