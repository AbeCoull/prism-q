[package]
name = "prism-q"
version = "0.27.0"
edition = "2024"
rust-version = "1.85.0"
authors = ["A. Coull"]
description = "PRISM-Q: Performance Rust Interoperable Simulator for Quantum"
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/prism-q"
repository = "https://github.com/AbeCoull/prism-q"
homepage = "https://github.com/AbeCoull/prism-q"
keywords = ["quantum", "quantum-computing", "simulator", "stabilizer", "qec"]
categories = ["science", "science::quantum-computing", "simulation", "mathematics"]

[workspace]
members = [".", "bindings/python"]
default-members = ["."]
resolver = "3"

[dependencies]
num-complex = "0.4"
rand = "0.10"
rand_chacha = "0.10"
smallvec = "1"
thiserror = "2"
rayon = { version = "1.12", optional = true }
num_cpus = { version = "1", optional = true }
faer = { version = "0.24", optional = true, default-features = false, features = ["std", "rayon", "linalg"] }
cudarc = { version = "0.19", optional = true, default-features = false, features = ["cuda-12040", "dynamic-linking", "driver", "nvrtc", "std"] }
mpi = { version = "0.8", optional = true }

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[features]
default = ["parallel"]
parallel = ["rayon", "num_cpus", "faer"]
gpu = ["dep:cudarc"]
distributed = []
distributed-mpi = ["distributed", "dep:mpi"]
bench-fast = []
bench-internal = []

# rustdoc compiles but never links, so the gpu surface documents without a CUDA toolkit
# (cudarc's build script with the pinned cuda-12040 feature does not probe for one).
# distributed-mpi is excluded: mpi-sys fails in its build script without an MPI library,
# which the docs.rs sandbox does not have.
[package.metadata.docs.rs]
features = ["parallel", "gpu", "distributed"]
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Tests run optimized. The suite is dominated by simulation work inside the
# crate, not by test scaffolding, so an unoptimized build cost 140s of wall time
# against 40s here, and the worst file (`fusion_correctness`, 101 cases at 16-20
# qubits) fell from 44.7s to 5.5s. Debug assertions and overflow checks stay on:
# the `debug_assert_eq!` guards in the backend kernels are load-bearing, and
# opt-level 2 rather than 3 keeps the incremental rebuild penalty to about 14s.
[profile.test]
opt-level = 2
debug-assertions = true
overflow-checks = true

# Benchmarks keep full symbols but only line tables. `lto = "fat"` with
# `codegen-units = 1` makes every bench relink expensive, and dropping type and
# variable debug info cut the rebuild of the `circuits` target after a
# `src/lib.rs` touch from 294s to 202s on the reference host. The 24MB PDB still
# carries function names and line numbers, which is all the flamegraph scripts
# resolve, so profiling output is unchanged.
[profile.bench]
inherits = "release"
debug = "line-tables-only"
strip = "none"

# Dedicated profile for the Python bindings (bindings/python). PyO3 converts a
# Rust panic into a Python exception at the FFI boundary via stack unwinding,
# which `[profile.release] panic = "abort"` would defeat (a panic would abort
# the interpreter instead of raising). Cargo profiles are workspace-global, so
# maturin targets this profile to build the cdylib with unwinding while the main
# crate's own release builds and benchmarks keep `panic = "abort"`.
[profile.python-release]
inherits = "release"
panic = "unwind"

[package.metadata.release]
pre-release-hook = ["git-cliff", "-o", "CHANGELOG.md", "--tag", "v{{version}}"]
sign-commit = false
sign-tag = false
push-remote = "origin"
publish = true
pre-release-commit-message = "chore(release): {{version}}"
tag-name = "v{{version}}"
tag-message = "{{version}}"
tag = true

[[bench]]
name = "bench_driver"
harness = false

[[bench]]
name = "circuits"
harness = false

[[bench]]
name = "svd_bench"
harness = false

[[bench]]
name = "bench_shots_perf"
harness = false

[[bench]]
name = "bench_gpu"
harness = false
required-features = ["gpu"]

[[example]]
name = "dist_mpi_check"
required-features = ["distributed-mpi"]

[[bench]]
name = "qec_t_strategies"
harness = false
