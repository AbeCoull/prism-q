# Rust-to-Python parity manifest, checked by tests/test_parity.py.
#
# The test reads docs/architecture/public-api.txt, keeps the items the [scope] rules
# select, and fails when a tracked item has no entry under [items] or an entry names a
# Rust item that no longer exists. CI regenerates the snapshot for every new public
# Rust item, so each one reaching the tracked surface needs a Python decision here.
#
# Keys: `Type::member` for a method, field or enum variant (module path dropped,
# generic parameters stripped), a bare name for a crate-root function, and the module
# path below the crate root for a function exported only from a module. Methods of
# trait impls and fields of enum variants are never tracked.
#
# Values: the Python name, dotted from the `prism_q` package, which must resolve; or
# `{ rust_only = "reason" }`.

[scope]
# Every member of these types is tracked.
types = [
  # Entry points and builders
  "Simulate", "SimulateProgram", "CircuitBuilder", "Circuit", "BackendKind",
  "Parameters", "PreparedCircuit", "PauliObservable", "CompiledSampler",
  "DynamicProgram", "DynamicProgramBuilder", "ThreadPool",
  # Results
  "RunOutcome", "ShotsResult", "CountsResult", "MarginalsResult", "ExpectationResult",
  "ObservableExpectation", "ObservableVariance", "OverlapResult", "EntropyResult",
  "ReducedDensityMatrix", "RunMetadata", "BondReport", "ExpectationGradient",
  # QEC
  "QecProgram", "QecSampleResult", "QecObservableEstimate", "QecOptions", "QecBasis",
  "QecPauli", "QecRecordRef", "QecNoise", "QecCircuitNoise", "QecTStrategy",
  "DetectorErrorModel", "ErrorMechanism", "UnionFindDecoder", "MatchingDecoder",
  "BpOsdDecoder", "BpOsdOptions", "BpMethod", "OsdMethod",
  # Noise construction
  "NoiseModel", "NoiseBuilder", "NoiseChannel", "GateFilter", "GateTimes",
  "DriftDistribution", "DeviceCalibration", "ReadoutError",
]
# Every free function is tracked except those matching these patterns.
exclude = [
  "distributed::*",               # communicator plumbing under the distributed backend
  "qec::observable_reroute::*",   # SPD rerouting internals of the T-strategy runner
  "sim::compiled::*_chunk_size",  # sampler chunk tuning
]

[items]
