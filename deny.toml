[graph]
all-features = true

[advisories]
ignore = [
    # paste: unmaintained, transitive dep from faer/gemm. Revisit when upstream moves to pastey.
    { id = "RUSTSEC-2024-0436", reason = "transitive dep from faer, revisit when deps migrate to pastey" },
    # custom_derive: unmaintained, transitive dep from optional mpi via conv.
    { id = "RUSTSEC-2025-0058", reason = "transitive dep from optional mpi, revisit when mpi removes conv/custom_derive" },
    # proc-macro-error2 and bincode 1: unmaintained, transitive dev deps from iai-callgrind
    # (its proc macros and the bench-to-runner handshake). Neither reaches the library.
    { id = "RUSTSEC-2026-0173", reason = "transitive dev dep from iai-callgrind-macros, revisit on its next release" },
    { id = "RUSTSEC-2025-0141", reason = "transitive dev dep from iai-callgrind, revisit on its next release" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
