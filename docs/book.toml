[book]
title = "PRISM-Q documentation"
description = "Performance-first Rust quantum circuit simulator. OpenQASM 3.0 input, nine CPU backends, SIMD kernels, optional CUDA and MPI paths, Python bindings."
authors = ["A. Coull"]
language = "en"
src = "."

[output.html]
default-theme = "light"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/AbeCoull/prism-q"
git-repository-icon = "fa-github"
edit-url-template = "https://github.com/AbeCoull/prism-q/edit/main/docs/{path}"
additional-css = ["theme/custom.css", "mdbook-admonish.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js", "theme/circuit-scroll.js", "theme/pq-ui.js"]
mathjax-support = false

[output.html.redirect]
"/benchmarks.html" = "performance/index.html"
"/comparison.html" = "performance/index.html"
"/comparison/methodology.html" = "../guides/benchmarking.html"
"/comparison/results.html" = "../performance/index.html"
"/comparison/report.html" = "../performance/index.html"
"/comparison/probability-vector.html" = "../performance/index.html"

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 20
use-boolean-and = true
boost-title = 2

[preprocessor.katex]
after = ["links"]

[preprocessor.admonish]
command = "mdbook-admonish"
assets_version = "3.1.0" # do not edit: managed by `mdbook-admonish install`

[preprocessor.mermaid]
command = "mdbook-mermaid"
