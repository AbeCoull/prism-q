<svg xmlns="http://www.w3.org/2000/svg" width="448.0" height="320.0" viewBox="0 0 448.0 320.0" class="pq-circuit" role="img" aria-label="Quantum circuit: 5 qubits, 5 moments">
<defs><marker id="arrow-meas" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 6 3 L 0 6 z" fill="var(--meas-str)"/></marker></defs>
<style>.pq-circuit{--bg:#ffffff;--wire:#626262;--text:#252525;--ctrl-dot:#252525;--ctrl-bdr:#ffffff;--swap:#454545;--barrier:#b0b0b0;--std-fill:#ffffff;--std-str:#363636;--std-txt:#252525;--par-fill:#ffffff;--par-str:#4c6775;--par-txt:#252525;--pha-fill:#ffffff;--pha-str:#5d6e64;--pha-txt:#252525;--ctrl-fill:#ffffff;--ctrl-str:#303030;--ctrl-txt:#252525;--meas-fill:#f2f2f2;--meas-str:#7b6650;--meas-txt:#54432f;--mfus-fill:#ffffff;--mfus-str:#707070;--mfus-txt:#454545;}@media(prefers-color-scheme:dark){.pq-circuit{--bg:#181818;--wire:#858585;--text:#dddddd;--ctrl-dot:#dddddd;--ctrl-bdr:#181818;--swap:#cccccc;--barrier:#777777;--std-fill:#181818;--std-str:#cccccc;--std-txt:#dddddd;--par-fill:#181818;--par-str:#8fa7b5;--par-txt:#dddddd;--pha-fill:#181818;--pha-str:#9aafa2;--pha-txt:#dddddd;--ctrl-fill:#181818;--ctrl-str:#dddddd;--ctrl-txt:#dddddd;--meas-fill:#242424;--meas-str:#ab9986;--meas-txt:#c5b5a2;--mfus-fill:#181818;--mfus-str:#a2a2a2;--mfus-txt:#cccccc;}}.pq-circuit{font-size:20px;}.pq-circuit text{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;text-rendering:optimizeLegibility;font-variant-numeric:tabular-nums;}.pq-circuit .gate text{font-family:Cambria,'Times New Roman',serif;}.pq-circuit .gate .gate-name{font-style:italic;}.pq-circuit .gate .gate-param{font-family:Arial,Helvetica,sans-serif;fill:var(--text);opacity:0.85;}.pq-circuit .gate,.pq-circuit .ctrl{}.pq-circuit .gate-std rect,.pq-circuit .gate-std circle{fill:var(--std-fill);stroke:var(--std-str);}.pq-circuit .gate-std text{fill:var(--std-txt);}.pq-circuit .gate-par rect,.pq-circuit .gate-par circle{fill:var(--par-fill);stroke:var(--par-str);}.pq-circuit .gate-par text{fill:var(--par-txt);}.pq-circuit .gate-pha rect,.pq-circuit .gate-pha circle{fill:var(--pha-fill);stroke:var(--pha-str);}.pq-circuit .gate-pha text{fill:var(--pha-txt);}.pq-circuit .gate-ctrl rect,.pq-circuit .gate-ctrl circle{fill:var(--ctrl-fill);stroke:var(--ctrl-str);}.pq-circuit .gate-ctrl text{fill:var(--ctrl-txt);}.pq-circuit .gate-meas rect,.pq-circuit .gate-meas circle{fill:var(--meas-fill);stroke:var(--meas-str);}.pq-circuit .gate-meas text{fill:var(--meas-txt);}.pq-circuit .gate-mfus rect,.pq-circuit .gate-mfus circle{fill:var(--mfus-fill);stroke:var(--mfus-str);}.pq-circuit .gate-mfus text{fill:var(--mfus-txt);}.pq-circuit .gate-ctrl line{stroke:var(--ctrl-str);}.pq-circuit .gate-meas path,.pq-circuit .gate-meas line{stroke:var(--meas-txt);}.pq-circuit .qlabel{font-family:Cambria,'Times New Roman',serif;}.pq-circuit .stats{font-family:Arial,Helvetica,sans-serif;}.pq-circuit .qlabel{fill:var(--text);}.pq-circuit .qlabel:not([font-size]){font-size:18.4px;}</style>
<g id="layer-bg" role="presentation">
<rect width="100%" height="100%" fill="var(--bg)"/>
</g>
<g id="layer-wires">
<text x="56.0" y="32.0" text-anchor="end" dominant-baseline="central" class="qlabel" aria-label="q[0]"><tspan font-style="italic">q</tspan><tspan baseline-shift="sub" font-size="12.8px">0</tspan></text>
<text x="56.0" y="96.0" text-anchor="end" dominant-baseline="central" class="qlabel" aria-label="q[1]"><tspan font-style="italic">q</tspan><tspan baseline-shift="sub" font-size="12.8px">1</tspan></text>
<text x="56.0" y="160.0" text-anchor="end" dominant-baseline="central" class="qlabel" aria-label="q[2]"><tspan font-style="italic">q</tspan><tspan baseline-shift="sub" font-size="12.8px">2</tspan></text>
<text x="56.0" y="224.0" text-anchor="end" dominant-baseline="central" class="qlabel" aria-label="q[3]"><tspan font-style="italic">q</tspan><tspan baseline-shift="sub" font-size="12.8px">3</tspan></text>
<text x="56.0" y="288.0" text-anchor="end" dominant-baseline="central" class="qlabel" aria-label="q[4]"><tspan font-style="italic">q</tspan><tspan baseline-shift="sub" font-size="12.8px">4</tspan></text>
<line x1="64.0" y1="32.0" x2="424.0" y2="32.0" stroke="var(--wire)" stroke-width="1" stroke-linecap="round" shape-rendering="crispEdges"/>
<line x1="64.0" y1="96.0" x2="424.0" y2="96.0" stroke="var(--wire)" stroke-width="1" stroke-linecap="round" shape-rendering="crispEdges"/>
<line x1="64.0" y1="160.0" x2="424.0" y2="160.0" stroke="var(--wire)" stroke-width="1" stroke-linecap="round" shape-rendering="crispEdges"/>
<line x1="64.0" y1="224.0" x2="424.0" y2="224.0" stroke="var(--wire)" stroke-width="1" stroke-linecap="round" shape-rendering="crispEdges"/>
<line x1="64.0" y1="288.0" x2="424.0" y2="288.0" stroke="var(--wire)" stroke-width="1" stroke-linecap="round" shape-rendering="crispEdges"/>
</g>
<g id="layer-gates">
<g class="gate gate-std" aria-label="H"><title>H on q[0]</title><rect x="77.0" y="9.0" width="46.0" height="46.0" rx="1" stroke-width="1.25"/>
<text x="100.0" y="32.0" text-anchor="middle" class="gate-name" dominant-baseline="central">H</text></g>
<line x1="172.0" y1="32.0" x2="172.0" y2="96.0" stroke="var(--ctrl-str)" stroke-width="1" shape-rendering="crispEdges"/>
<g class="ctrl"><title>CX: ctrl q[0] → target q[1]</title><circle cx="172.0" cy="32.0" r="4.2" fill="var(--ctrl-dot)" stroke="var(--ctrl-bdr)" stroke-width="1"/></g>
<g class="gate gate-ctrl"><title>CX: ctrl q[0] → target q[1]</title><circle cx="172.0" cy="96.0" r="13.8" stroke-width="1.25"/><line x1="158.2" y1="96.0" x2="185.8" y2="96.0" stroke-width="1.25"/><line x1="172.0" y1="82.2" x2="172.0" y2="109.8" stroke-width="1.25"/></g>
<line x1="244.0" y1="96.0" x2="244.0" y2="160.0" stroke="var(--ctrl-str)" stroke-width="1" shape-rendering="crispEdges"/>
<g class="ctrl"><title>CX: ctrl q[1] → target q[2]</title><circle cx="244.0" cy="96.0" r="4.2" fill="var(--ctrl-dot)" stroke="var(--ctrl-bdr)" stroke-width="1"/></g>
<g class="gate gate-ctrl"><title>CX: ctrl q[1] → target q[2]</title><circle cx="244.0" cy="160.0" r="13.8" stroke-width="1.25"/><line x1="230.2" y1="160.0" x2="257.8" y2="160.0" stroke-width="1.25"/><line x1="244.0" y1="146.2" x2="244.0" y2="173.8" stroke-width="1.25"/></g>
<line x1="316.0" y1="160.0" x2="316.0" y2="224.0" stroke="var(--ctrl-str)" stroke-width="1" shape-rendering="crispEdges"/>
<g class="ctrl"><title>CX: ctrl q[2] → target q[3]</title><circle cx="316.0" cy="160.0" r="4.2" fill="var(--ctrl-dot)" stroke="var(--ctrl-bdr)" stroke-width="1"/></g>
<g class="gate gate-ctrl"><title>CX: ctrl q[2] → target q[3]</title><circle cx="316.0" cy="224.0" r="13.8" stroke-width="1.25"/><line x1="302.2" y1="224.0" x2="329.8" y2="224.0" stroke-width="1.25"/><line x1="316.0" y1="210.2" x2="316.0" y2="237.8" stroke-width="1.25"/></g>
<line x1="388.0" y1="224.0" x2="388.0" y2="288.0" stroke="var(--ctrl-str)" stroke-width="1" shape-rendering="crispEdges"/>
<g class="ctrl"><title>CX: ctrl q[3] → target q[4]</title><circle cx="388.0" cy="224.0" r="4.2" fill="var(--ctrl-dot)" stroke="var(--ctrl-bdr)" stroke-width="1"/></g>
<g class="gate gate-ctrl"><title>CX: ctrl q[3] → target q[4]</title><circle cx="388.0" cy="288.0" r="13.8" stroke-width="1.25"/><line x1="374.2" y1="288.0" x2="401.8" y2="288.0" stroke-width="1.25"/><line x1="388.0" y1="274.2" x2="388.0" y2="301.8" stroke-width="1.25"/></g>
</g>
</svg>
